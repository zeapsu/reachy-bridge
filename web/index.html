<!doctype html>
<html lang="en" data-scheme="amber">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#e9eef2" media="(prefers-color-scheme: light)">
  <title>reachy-bridge</title>
  <!-- Built from one master by tools/icons/build_icons.py. -->
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <script>
    // Restore the saved accent and light/dark choice before first paint (no
    // flash). The controls live in System · Appearance (logic/appearance.ts).
    try {
      document.documentElement.dataset.scheme = localStorage.getItem("reachy-theme") || "amber";
      var mode = localStorage.getItem("reachy-mode");
      if (mode === "light" || mode === "dark") document.documentElement.dataset.theme = mode;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
