<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070810">
  <title>Starting app…</title>
  <script>
    // Same colour theme as the dashboard that opened this tab.
    try { document.documentElement.dataset.scheme = localStorage.getItem("reachy-theme") || "amber"; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="atmosphere" aria-hidden="true"><span class="blob a"></span><span class="blob b"></span><span class="blob c"></span></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="loading-shell">
    <section class="glass loading-card" id="card" aria-live="polite">
      <svg class="loading-head" viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
        <g class="ant l"><path d="M34 34 26 12"/><circle cx="25" cy="10" r="3" fill="currentColor"/></g>
        <g class="ant r"><path d="M62 34 70 12"/><circle cx="71" cy="10" r="3" fill="currentColor"/></g>
        <rect x="16" y="32" width="64" height="42" rx="21"/>
        <circle class="eye" cx="37" cy="53" r="6" fill="currentColor"/>
        <circle class="eye" cx="59" cy="53" r="6" fill="currentColor"/>
        <path d="M36 84h24"/>
      </svg>
      <div class="loading-kicker">reachy · controller</div>
      <h1 class="loading-title" id="title">Starting app</h1>
      <ol class="loading-steps">
        <li data-step="waking"><span class="mark"></span>Waking Reachy</li>
        <li data-step="starting"><span class="mark"></span><span id="starting-label">Starting the app</span></li>
        <li data-step="opening"><span class="mark"></span>Opening its interface</li>
      </ol>
      <div class="loading-bar"><span id="bar"></span></div>
      <p class="loading-foot" id="foot">This tab switches to the app when it's ready.</p>
    </section>
  </main>

  <script type="module" src="/src/loading/loading.ts"></script>
</body>
</html>
