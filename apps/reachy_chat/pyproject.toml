[build-system]
requires = [ "setuptools",]
build-backend = "setuptools.build_meta"

[project]
name = "reachy_chat"
version = "0.7.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
dependencies = [ "aiortc>=1.13.0", "av", "fastrtc>=0.0.34", "faster-whisper>=1.0.0", "huggingface-hub>=1.17.0", "httpx>=0.28.1", "python-dotenv", "openai>=2.30.0", "pyttsx3>=2.90", "google-genai>=1.0.0", "reachy_mini_dances_library", "reachy_mini_toolbox", "reachy-mini>=1.8.3", "mcp>=1.27.1",]
[[project.authors]]
name = "Pollen Robotics"
email = "contact@pollen-robotics.com"

[dependency-groups]
dev = [ "pytest", "pytest-asyncio", "ruff==0.12.0", "mypy==1.18.2", "pre-commit",]

[project.optional-dependencies]
local_vision = [ "accelerate>=1.13.0", "torch>=2.1", "transformers==5.3.0",]
yolo_vision = [ "ultralytics", "supervision<0.28", "opencv-python>=4.13.0.92",]
mediapipe_vision = [ "mediapipe==0.10.14",]
all_vision = [ "accelerate>=1.13.0", "torch>=2.1", "transformers==5.3.0", "ultralytics", "supervision<0.28", "opencv-python>=4.13.0.92", "mediapipe==0.10.14",]

[project.scripts]
reachy-chat = "reachy_chat.main:main"

[tool.uv]
exclude-newer = "7 days"

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 119
exclude = [ ".venv", "dist", "build", "**/__pycache__", "*.egg-info", ".mypy_cache", ".pytest_cache",]

[tool.mypy]
python_version = "3.12"
files = [ "src/",]
ignore_missing_imports = true
strict = true
show_error_codes = true
warn_unused_ignores = true

[project.entry-points.reachy_mini_apps]
reachy_chat = "reachy_chat.main:ReachyChat"

[tool.uv.exclude-newer-package]
reachy-mini = false
reachy-mini-dances-library = false
reachy-mini-toolbox = false

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
reachy_talk_data = [ "profiles/**/*.txt", "profiles/**/*.py",]
reachy_chat = [ "static/**/*", ".env.example", "prompts/**/*.txt",]

[tool.ruff.lint]
select = [ "E", "F", "W", "I", "C4", "D",]
ignore = [ "E501", "D100", "D203", "D213",]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.setuptools.packages.find]
where = [ "src",]

[tool.ruff.lint.isort]
length-sort = true
lines-after-imports = 2
no-lines-before = [ "standard-library", "local-folder",]
known-local-folder = [ "reachy_chat",]
known-first-party = [ "reachy_mini", "reachy_mini_dances_library", "reachy_mini_toolbox",]
split-on-trailing-comma = true
