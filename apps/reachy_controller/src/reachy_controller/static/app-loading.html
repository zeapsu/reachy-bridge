<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070810">
  <title>Starting app…</title>
  <script>
    // Same colour theme as the dashboard that opened this tab.
    try { document.documentElement.dataset.scheme = localStorage.getItem("reachy-theme") || "amber"; } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .loading-shell {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    .loading-card {
      width: min(420px, 100%);
      padding: 32px 28px 26px;
      text-align: center;
    }
    .loading-head {
      width: 96px;
      height: 96px;
      margin: 0 auto 18px;
      color: var(--amber);
      filter: drop-shadow(0 0 18px var(--glow-a));
    }
    .loading-head .ant { transform-box: fill-box; animation: ant-wiggle 1.6s var(--ease) infinite; }
    .loading-head .ant.r { transform-origin: 0% 100%; animation-delay: 0.2s; }
    .loading-head .ant.l { transform-origin: 100% 100%; }
    .loading-head .eye { animation: blink 4s steps(1) infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes ant-wiggle { 50% { transform: rotate(-12deg); } }
    @keyframes blink { 0%, 92% { transform: scaleY(1); } 94% { transform: scaleY(0.1); } }
    .loading-kicker {
      font: 500 11px/1 "JetBrains Mono", monospace;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .loading-title {
      margin: 8px 0 22px;
      font: 600 26px/1.15 "Space Grotesk", sans-serif;
      color: var(--text);
      overflow-wrap: anywhere;
    }
    .loading-steps {
      list-style: none;
      margin: 0 auto;
      padding: 0;
      display: grid;
      gap: 12px;
      width: fit-content;
      text-align: left;
    }
    .loading-steps li {
      display: flex;
      align-items: center;
      gap: 12px;
      font: 500 14px/1.2 "Inter", sans-serif;
      color: var(--muted);
      transition: color 0.3s var(--ease);
    }
    .loading-steps .mark {
      flex: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--glass-edge);
      display: grid;
      place-items: center;
    }
    .loading-steps li.active { color: var(--text); }
    .loading-steps li.active .mark {
      border-color: transparent;
      background: conic-gradient(from 0deg, var(--amber) 0deg, color-mix(in srgb, var(--amber) 15%, transparent) 360deg);
      -webkit-mask: radial-gradient(circle, transparent 5px, #000 5.5px);
      mask: radial-gradient(circle, transparent 5px, #000 5.5px);
      animation: spin 1s linear infinite;
    }
    .loading-steps li.done { color: var(--text); }
    .loading-steps li.done .mark { border-color: var(--mint); background: color-mix(in srgb, var(--mint) 22%, transparent); }
    .loading-steps li.done .mark::after {
      content: "";
      width: 7px;
      height: 4px;
      margin-top: -2px;
      border: solid var(--mint);
      border-width: 0 0 2px 2px;
      transform: rotate(-45deg);
    }
    .loading-bar {
      height: 3px;
      margin: 24px 0 14px;
      border-radius: 3px;
      background: var(--glass-fill-2);
      overflow: hidden;
    }
    .loading-bar span {
      display: block;
      height: 100%;
      width: 8%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--amber), var(--cyan));
      box-shadow: 0 0 12px var(--glow-a);
      transition: width 0.8s var(--ease);
    }
    .loading-foot { margin: 0; font: 400 12px/1.4 "Inter", sans-serif; color: var(--muted); }
    .loading-card.failed .loading-head { color: var(--coral); filter: none; }
    .loading-card.failed .ant, .loading-card.failed .eye { animation: none; }
    .loading-card.failed .loading-bar span { background: var(--coral); box-shadow: none; }
    .loading-card.failed .loading-foot { color: var(--coral); }
    @media (prefers-reduced-motion: reduce) {
      .loading-head .ant, .loading-head .eye, .loading-steps li.active .mark { animation: none; }
    }
  </style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true"><span class="blob a"></span><span class="blob b"></span><span class="blob c"></span></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="loading-shell">
    <section class="glass loading-card" id="card" aria-live="polite">
      <svg class="loading-head" viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
        <g class="ant l"><path d="M34 34 26 12"/><circle cx="25" cy="10" r="3" fill="currentColor"/></g>
        <g class="ant r"><path d="M62 34 70 12"/><circle cx="71" cy="10" r="3" fill="currentColor"/></g>
        <rect x="16" y="32" width="64" height="42" rx="21"/>
        <circle class="eye" cx="37" cy="53" r="6" fill="currentColor"/>
        <circle class="eye" cx="59" cy="53" r="6" fill="currentColor"/>
        <path d="M36 84h24"/>
      </svg>
      <div class="loading-kicker">reachy · controller</div>
      <h1 class="loading-title" id="title">Starting app</h1>
      <ol class="loading-steps">
        <li data-step="waking"><span class="mark"></span>Waking Reachy</li>
        <li data-step="starting"><span class="mark"></span><span id="starting-label">Starting the app</span></li>
        <li data-step="opening"><span class="mark"></span>Opening its interface</li>
      </ol>
      <div class="loading-bar"><span id="bar"></span></div>
      <p class="loading-foot" id="foot">This tab switches to the app when it's ready.</p>
    </section>
  </main>

  <script>
    // The dashboard drives this page through the URL hash: #waking, #starting,
    // #opening, or #failed:<message>. It then points this tab at the app.
    (function () {
      const params = new URLSearchParams(window.location.search);
      const app = params.get("app") || "app";
      const order = ["waking", "starting", "opening"];
      const progress = { waking: 22, starting: 55, opening: 88 };
      document.title = `Starting ${app}…`;
      document.getElementById("title").textContent = app;
      document.getElementById("starting-label").textContent = `Starting ${app}`;

      function render() {
        const hash = decodeURIComponent(window.location.hash.slice(1)) || "waking";
        const card = document.getElementById("card");
        if (hash.startsWith("failed")) {
          card.classList.add("failed");
          document.title = `${app} didn't start`;
          document.getElementById("foot").textContent =
            `${hash.slice("failed:".length) || "The app didn't start."} You can close this tab.`;
          document.querySelectorAll(".loading-steps li.active").forEach((li) => li.classList.remove("active"));
          return;
        }
        const index = Math.max(0, order.indexOf(hash));
        document.querySelectorAll(".loading-steps li").forEach((li) => {
          const at = order.indexOf(li.dataset.step);
          li.classList.toggle("done", at < index);
          li.classList.toggle("active", at === index);
        });
        document.getElementById("bar").style.width = `${progress[order[index]]}%`;
      }

      window.addEventListener("hashchange", render);
      render();
    })();
  </script>
</body>
</html>
