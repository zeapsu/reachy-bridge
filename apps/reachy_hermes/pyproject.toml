[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reachy_hermes"
version = "0.1.0"
description = "Reachy Mini voice app backed by the local Hermes agent"
requires-python = ">=3.12"
dependencies = [
    "fastrtc>=0.0.34",
    "numpy>=2.0",
    "reachy-mini>=1.8.3",
    "sherpa-onnx==1.13.4",
    "sherpa-onnx-core==1.13.4",
    "websockets>=13,<17",
    "reachy_chat",
    "pi-agent-core==0.1.1",
]

[project.entry-points."reachy_mini_apps"]
reachy_hermes = "reachy_hermes.main:ReachyHermes"

[project.scripts]
reachy-hermes = "reachy_hermes.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
]

[tool.uv.sources]
reachy_chat = { workspace = true }

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
