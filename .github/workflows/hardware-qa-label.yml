name: Hardware QA label
# A PR that changes what the robot does or how the bridge runs on it gets
# "needs hardware QA" (#306): all of the controller and the runtime wrapper
# (motion, power and torque, return-home and the one-actuator guards, the
# daemon and its features, platform adapters), its Rust dependencies and
# build script, the dashboard code that drives the robot (hooks, API, logic
# and the panels that move it), the installer, units, CLI and udev rules, the
# shipped webrtcsink build, and the Python dependencies the robot runs. Sim-only files don't count. The label stays on
# after merge until the owner has QA'd the change on the robot and removes
# it; nothing here ever removes it, so a label an agent adds by hand stays
# too. With none left on merged PRs (and no open `regression` issue), the
# agent tags the next rc (AGENTS.md, "Channels"). Audio code also has its own
# device-test label (audio-label.yml).
#
# PRs opened with the workflow token start no workflows; the upstream watch
# labels its own lock bumps when it opens them. The label job isn't a
# required check: if it fails, label the PR by hand.
#
# pull_request_target runs this file as it is on main, and it checks nothing
# out: it only reads the PR's file list and sets the label.
on:
  pull_request_target:
    # edited: a PR retargeted to main from another branch.
    types: [opened, reopened, synchronize, edited]
permissions:
  contents: read
env:
  NEEDS: "needs hardware QA"
jobs:
  label:
    # Open PRs only, and `edited` only for a new base: editing a merged PR's
    # title must not put back a label the owner removed after QA.
    if: >-
      github.repository == 'zeapsu/reachy-bridge' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      (github.event.action != 'edited' || github.event.changes.base.ref.from != '')
    concurrency:
      group: hardware-qa-label-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # AGENTS.md ("Channels") reads these two lines from this file; keep
          # each a single-quoted one-liner.
          robot='^(controller/src/.+\.rs|controller/Cargo\.(toml|lock)|controller/build\.rs|runtime/src/reachy_bridge_runtime/.+\.py|web/src/(hooks/use(Drive|Power|Control|Expressions|Apps|Voice)|api/(power|control|expressions|apps)|logic/(drive|power|moves|pose|control|controls|expressions)|components/(DrivePanel|ControlStrip|ControlsPanel|ExpressionsPanel|AppsPanel))\.tsx?|deploy/.+|tools/udev/.+|tools/build_webrtcsink_jetson\.sh|runtime/pyproject\.toml|uv\.lock)$'
          simonly='^(runtime/src/reachy_bridge_runtime/features/sim_[a-z_]+\.py|deploy/systemd/reachy-bridge-sim\.service)$'
          # Both names of a renamed file.
          files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          hits=$(grep -E "$robot" <<<"$files" | grep -vE "$simonly" || true)
          if [[ -z $hits ]]; then
            echo "Nothing the robot runs changed."
            exit 0
          fi
          # File names are the PR author's: no control characters reach the log.
          tr -d '\000-\011\013-\037\177' <<<"$hits"
          gh label create "$NEEDS" --color B60205 --description "Changes robot-side code; the owner removes this after QA on the robot" 2>/dev/null || true
          gh api -X POST "repos/$GH_REPO/issues/$PR/labels" -f "labels[]=$NEEDS" >/dev/null
