name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The Dependabot branch updater starts CI this way after it merges main into
  # a branch, since its own push doesn't trigger workflows.
  workflow_dispatch:
  # The release workflow runs these jobs before it publishes; the upstream
  # watch runs them against a lock-bump branch (ref).
  workflow_call:
    inputs:
      ref:
        description: Branch or SHA to test; empty means the triggering commit.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # A new push to a PR cancels its superseded run; main and tags run to completion.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ubuntu-24.04-arm ships GStreamer 1.24.2, the same version as JetPack 7.
# Every job has a timeout a few times its usual length, so a hung test fails
# the run instead of holding a runner for GitHub's default six hours.
jobs:
  python:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Tool versions come from mise.toml.
      - id: tools
        run: python3 tools/toolchain_versions.py >> "$GITHUB_OUTPUT"
      # PyGObject and pycairo have no Linux wheels, so uv builds them from
      # source against the girepository and cairo headers. reachy_mini's media
      # modules load the Gst and GstApp typelibs at import, which --check does;
      # the audio gateway's tests load GstWebRTC (plugins-bad).
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgirepository1.0-dev libcairo2-dev \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gir1.2-gst-plugins-bad-1.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.tools.outputs.uv }}
          enable-cache: true
          # A lock-bump run from the upstream watch tests unreviewed code; keep
          # its caches away from main's.
          save-cache: ${{ inputs.ref == '' }}
      - run: uv sync --frozen
      - run: uv run ruff check runtime tools
      - run: uv run ruff format --check
      # Coverage is reported in the job summary, not checked.
      - run: uv run pytest --cov=reachy_bridge_runtime --cov-report=
      - name: Coverage summary
        if: always() && hashFiles('.coverage') != ''
        run: |
          {
            echo "## Python coverage: $(uv run coverage report --format=total)% of lines"
            echo "<details><summary>By file</summary>"
            echo
            uv run coverage report --format=markdown --sort=cover
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check the upstream seam
        run: uv run reachy-bridge-runtime --check

  rust-web:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Tool versions come from mise.toml.
      - id: tools
        run: python3 tools/toolchain_versions.py >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.tools.outputs.bun }}
      - name: Install Rust
        env:
          RUST: ${{ steps.tools.outputs.rust }}
        run: |
          rustup toolchain install "$RUST" --profile minimal --component clippy,llvm-tools,rustfmt
          rustup default "$RUST"
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: controller
          # The coverage build has its own target dir; a new key caches it.
          key: llvm-cov
          save-if: ${{ inputs.ref == '' }}
      - name: Web
        working-directory: web
        run: |
          set -o pipefail  # bun test's failure, not tee's success
          bun install --frozen-lockfile
          bun run typecheck
          bun test --coverage 2>&1 | tee "$RUNNER_TEMP/bun-coverage.txt"
          bun run build
      # The controller embeds web/dist, so it builds after the web step.
      - name: Controller
        working-directory: controller
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          # cargo test under coverage; it skips doctests (the crate has none).
          cargo llvm-cov --locked --no-report
      - name: Coverage summary
        if: always()
        run: |
          {
            if [[ -f "$RUNNER_TEMP/bun-coverage.txt" ]]; then
              echo "## Dashboard coverage (of the files its tests load)"
              echo "<details><summary>bun test --coverage</summary>"
              echo
              echo '```'
              grep -E '^\s*(All files|File|-+\||\S.*\|)' "$RUNNER_TEMP/bun-coverage.txt" || true
              echo '```'
              echo "</details>"
            fi
            if report=$(cd controller && cargo llvm-cov report --summary-only 2>/dev/null); then
              echo "## Controller coverage: $(awk '/^TOTAL/ {print $10}' <<< "$report") of lines"
              echo "<details><summary>By file</summary>"
              echo
              echo '```'
              echo "$report"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The controller against a real daemon in MuJoCo sim (tools/sim/README.md).
  # --headless runs MuJoCo without a viewer or offscreen rendering, so the
  # runner needs no GL.
  sim:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Tool versions come from mise.toml.
      - id: tools
        run: python3 tools/toolchain_versions.py >> "$GITHUB_OUTPUT"
      # As in the python job: PyGObject and pycairo build from source.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgirepository1.0-dev libcairo2-dev \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.tools.outputs.uv }}
          enable-cache: true
          # A lock-bump run from the upstream watch tests unreviewed code; keep
          # its caches away from main's.
          save-cache: ${{ inputs.ref == '' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.tools.outputs.bun }}
      - name: Install Rust
        env:
          RUST: ${{ steps.tools.outputs.rust }}
        run: |
          rustup toolchain install "$RUST" --profile minimal
          rustup default "$RUST"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: controller
          save-if: ${{ inputs.ref == '' }}
      - run: uv sync --frozen
      - name: Web
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Controller
        working-directory: controller
        run: cargo build --release --locked
      # The dashboard's move datasets, which run.py downloads before the
      # daemon starts; a cached copy only needs Hugging Face's revision check.
      # Saved only by runs of reviewed code, like the other caches.
      - id: hf-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: hf-datasets-${{ hashFiles('tools/sim/run.py') }}
          restore-keys: hf-datasets-
      - name: Sim tests
        run: uv run python tools/sim/run.py --work-dir "$RUNNER_TEMP/sim"
      # Only a complete download is worth keeping: a partial one would stick
      # under this key.
      - id: hf-complete
        if: inputs.ref == '' && steps.hf-cache.outputs.cache-hit != 'true'
        run: |
          for name in emotions dances; do
            ls -d ~/.cache/huggingface/hub/datasets--pollen-robotics--reachy-mini-$name-library/snapshots/*/ >/dev/null 2>&1 || exit 0
          done
          echo save=true >> "$GITHUB_OUTPUT"
      - if: steps.hf-complete.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # Nothing to save when Hugging Face was down; that isn't a test failure.
        continue-on-error: true
        with:
          path: ~/.cache/huggingface/hub
          key: hf-datasets-${{ hashFiles('tools/sim/run.py') }}
      - name: Upload sim logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sim-logs
          path: |
            ${{ runner.temp }}/sim/*.log
            ${{ runner.temp }}/sim/controller-state/logs/
          if-no-files-found: ignore

  # The dashboard in Chromium against the sim stack, at desktop and phone
  # sizes: what a person does with it, plus axe-core accessibility checks and
  # layout/copy checks counted against web/e2e/baselines/. Not a required
  # check yet, while its numbers settle, and the upstream watch's lock-bump
  # runs leave it out.
  browser:
    if: inputs.ref == ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Tool versions come from mise.toml.
      - id: tools
        run: python3 tools/toolchain_versions.py >> "$GITHUB_OUTPUT"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgirepository1.0-dev libcairo2-dev \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gir1.2-gst-plugins-bad-1.0 \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-nice
      # The audio gateway only connects over the tailnet (100.64.0.0/10), so
      # give the runner an address there for the voice tests.
      - name: Add a tailnet address
        run: |
          sudo ip link add tailnet0 type dummy
          sudo ip addr add 100.64.0.1/32 dev tailnet0
          sudo ip link set tailnet0 up
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.tools.outputs.uv }}
          enable-cache: true
          save-cache: ${{ inputs.ref == '' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.tools.outputs.bun }}
      - name: Install Rust
        env:
          RUST: ${{ steps.tools.outputs.rust }}
        run: |
          rustup toolchain install "$RUST" --profile minimal
          rustup default "$RUST"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: controller
          save-if: ${{ inputs.ref == '' }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub
          key: hf-datasets-${{ hashFiles('tools/sim/run.py') }}
          restore-keys: hf-datasets-
      - run: uv sync --frozen
      - name: Web
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
          bunx playwright install --with-deps chromium
      - name: Controller
        working-directory: controller
        run: cargo build --release --locked
      - name: Browser tests
        run: uv run python tools/sim/run.py --audio --work-dir "$RUNNER_TEMP/sim" -- bash -c 'cd web && bunx playwright test'
      - name: Summary
        if: always()
        working-directory: web
        run: bun e2e/summary.ts >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-report
          path: |
            web/playwright-report/
            web/test-results/
            ${{ runner.temp }}/sim/*.log
          if-no-files-found: ignore

  # deploy/install.sh on a fresh machine with a real systemd user manager
  # (#201): it builds, installs and starts the units, the daemon and
  # controller answer with the robot off, a second run updates in place, and
  # the uninstaller leaves nothing behind. Not a required check yet. The
  # upstream watch's lock-bump runs leave it out.
  install:
    if: inputs.ref == ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tool versions come from mise.toml.
      - id: tools
        run: python3 tools/toolchain_versions.py >> "$GITHUB_OUTPUT"
      # As on a device: what reachy_mini's media modules and the runtime load.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgirepository1.0-dev libcairo2-dev \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0 gir1.2-gst-plugins-bad-1.0
      # setup-uv's tool-cache path has no /installs/ component, which
      # install.sh requires of the uv it writes into the daemon unit's PATH.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ steps.tools.outputs.uv }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.tools.outputs.bun }}
      - name: Install Rust
        env:
          RUST: ${{ steps.tools.outputs.rust }}
        run: |
          rustup toolchain install "$RUST" --profile minimal
          rustup default "$RUST"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: controller
          save-if: ${{ inputs.ref == '' }}
      # The runner has no login session; lingering starts its user manager,
      # which systemctl --user reaches through XDG_RUNTIME_DIR.
      - name: Start a systemd user manager
        timeout-minutes: 2
        run: |
          sudo loginctl enable-linger "$USER"
          runtime=/run/user/$(id -u)
          echo "XDG_RUNTIME_DIR=$runtime" >> "$GITHUB_ENV"
          # Where install.sh puts the reachy-bridge command.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          until [[ -S $runtime/systemd/private ]]; do sleep 1; done
          XDG_RUNTIME_DIR=$runtime systemctl --user is-system-running --wait || true
      - name: Install
        run: bash deploy/install.sh
      - name: Check the install
        run: bash tools/check_install.sh
      - name: Install again (update in place)
        run: bash deploy/install.sh
      - name: Check again
        run: bash tools/check_install.sh
      - name: Uninstall
        run: |
          reachy-bridge uninstall --yes
          bash tools/check_install.sh --gone
      - name: Service logs
        if: failure()
        run: sudo journalctl _UID="$(id -u)" --no-pager -n 300 || true

  shell:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      # sha256 of shellcheck-v0.11.0.linux.aarch64.tar.xz from the GitHub
      # release; update it with the version in mise.toml.
      SHELLCHECK_SHA256: 12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # Tool versions come from mise.toml.
      - id: tools
        run: python3 tools/toolchain_versions.py >> "$GITHUB_OUTPUT"
      # The runner's apt shellcheck is older than the version the scripts are
      # kept clean with, so fetch the pinned release binary.
      - name: Install shellcheck
        env:
          SHELLCHECK_VERSION: ${{ steps.tools.outputs.shellcheck }}
        run: |
          tarball="shellcheck-v${SHELLCHECK_VERSION}.linux.aarch64.tar.xz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$tarball"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
      - run: shellcheck --version
      - run: shellcheck deploy/install.sh deploy/uninstall.sh deploy/reachy-bridge tools/build_webrtcsink_jetson.sh tools/test_uninstall.sh tools/test_cli.sh tools/check_install.sh tools/review_gate.sh tools/test_review_gate.sh tools/catchup_check.sh tools/test_catchup_check.sh
      - run: bash tools/test_uninstall.sh
      - run: bash tools/test_cli.sh
      - run: bash tools/test_review_gate.sh
      - run: bash tools/test_catchup_check.sh
