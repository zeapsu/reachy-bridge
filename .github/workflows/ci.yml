name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs these jobs before it publishes; the upstream
  # watch runs them against a lock-bump branch (ref).
  workflow_call:
    inputs:
      ref:
        description: Branch or SHA to test; empty means the triggering commit.
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # A new push to a PR cancels its superseded run; main and tags run to completion.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ubuntu-24.04-arm ships GStreamer 1.24.2, the same version as JetPack 7.
# Every job has a timeout a few times its usual length, so a hung test fails
# the run instead of holding a runner for GitHub's default six hours.
jobs:
  python:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # PyGObject and pycairo have no Linux wheels, so uv builds them from
      # source against the girepository and cairo headers. reachy_mini's media
      # modules load the Gst and GstApp typelibs at import, which --check does.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgirepository1.0-dev libcairo2-dev \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.24"
          enable-cache: true
          # A lock-bump run from the upstream watch tests unreviewed code; keep
          # its caches away from main's.
          save-cache: ${{ inputs.ref == '' }}
      - run: uv sync --frozen
      - run: uv run ruff check runtime tools
      - run: uv run pytest
      - name: Check the upstream seam
        run: uv run reachy-bridge-runtime --check

  rust-web:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - name: Install Rust 1.96.0
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component clippy
          rustup default 1.96.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: controller
          save-if: ${{ inputs.ref == '' }}
      - name: Web
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test
          bun run build
      # The controller embeds web/dist, so it builds after the web step.
      - name: Controller
        working-directory: controller
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  # The controller against a real daemon in MuJoCo sim (tools/sim/README.md).
  # --headless runs MuJoCo without a viewer or offscreen rendering, so the
  # runner needs no GL.
  sim:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # As in the python job: PyGObject and pycairo build from source.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgirepository1.0-dev libcairo2-dev \
            gir1.2-gstreamer-1.0 gir1.2-gst-plugins-base-1.0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.24"
          enable-cache: true
          # A lock-bump run from the upstream watch tests unreviewed code; keep
          # its caches away from main's.
          save-cache: ${{ inputs.ref == '' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - name: Install Rust 1.96.0
        run: |
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: controller
          save-if: ${{ inputs.ref == '' }}
      - run: uv sync --frozen
      - name: Web
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Controller
        working-directory: controller
        run: cargo build --release --locked
      - name: Sim tests
        run: uv run python tools/sim/run.py --work-dir "$RUNNER_TEMP/sim"
      - name: Upload sim logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sim-logs
          path: |
            ${{ runner.temp }}/sim/*.log
            ${{ runner.temp }}/sim/controller-state/logs/
          if-no-files-found: ignore

  shell:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      SHELLCHECK_VERSION: "0.11.0"
      # sha256 of shellcheck-v0.11.0.linux.aarch64.tar.xz from the GitHub release.
      SHELLCHECK_SHA256: 12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # The runner's apt shellcheck is older than the version the scripts are
      # kept clean with, so fetch the pinned release binary.
      - name: Install shellcheck
        run: |
          tarball="shellcheck-v${SHELLCHECK_VERSION}.linux.aarch64.tar.xz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/$tarball"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"
      - run: shellcheck --version
      - run: shellcheck deploy/install.sh deploy/uninstall.sh deploy/reachy-bridge tools/build_webrtcsink_jetson.sh tools/test_uninstall.sh tools/test_cli.sh
      - run: bash tools/test_uninstall.sh
      - run: bash tools/test_cli.sh
