name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      # vX.Y.Z is a stable release; vX.Y.Z-rcN (or -rc.N) is a prerelease on the
      # nightly channel. Anything else matching the trigger glob is refused.
      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.?[0-9]+)?$ ]]; then
            echo "::error::tag $TAG is not vX.Y.Z or vX.Y.Z-rcN"
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: tag
    uses: ./.github/workflows/ci.yml

  release:
    needs: [tag, ci]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the release assets
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          git archive --format=tar.gz --prefix="reachy-bridge-${VERSION}/" \
            -o "$out/reachy-bridge-${VERSION}.tar.gz" HEAD
          cp uv.lock "$out/uv.lock"
          cd "$out"
          sha256sum "reachy-bridge-${VERSION}.tar.gz" uv.lock > SHA256SUMS
          cat SHA256SUMS
      # GitHub stores attestations only for public repositories here; a private
      # repo fails this step, so skip it until the repo goes public.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/release/SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: |
          # Hand-written notes in docs/releases/<tag>.md win; otherwise GitHub
          # lists the PRs merged since the previous tag.
          notes="docs/releases/${TAG}.md"
          if [[ -f "$notes" ]]; then
            flags=(--verify-tag --notes-file "$notes" --title "$TAG")
          else
            flags=(--verify-tag --generate-notes --title "$TAG")
          fi
          if [[ "$PRERELEASE" == true ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG" "$RUNNER_TEMP"/release/* "${flags[@]}"
