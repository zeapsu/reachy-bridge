name: webrtcsink

# Builds the gst-plugins-rs webrtc plugin (libgstrswebrtc.so) that the daemon
# needs, so releases can ship it and devices skip a 7-minute build (#132).
# ubuntu-24.04-arm has GStreamer 1.24.2, the same as JetPack 7. Runs on its own
# when this workflow, the build script or the toolchain changes, and from
# release.yml.

on:
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/webrtcsink.yml
      - tools/build_webrtcsink_jetson.sh
      - mise.toml
      - tools/toolchain_versions.py

permissions:
  contents: read

concurrency:
  group: webrtcsink-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GST_RS_VERSION: "0.14.5"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tool versions come from mise.toml.
      - id: tools
        run: python3 tools/toolchain_versions.py >> "$GITHUB_OUTPUT"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libgstreamer-plugins-bad1.0-dev gstreamer1.0-tools
      - name: Install Rust
        env:
          RUST: ${{ steps.tools.outputs.rust }}
        run: |
          rustup toolchain install "$RUST" --profile minimal
          rustup default "$RUST"
      - name: Build
        run: bash tools/build_webrtcsink_jetson.sh --out "$RUNNER_TEMP/webrtcsink"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webrtcsink
          path: ${{ runner.temp }}/webrtcsink/libgstrswebrtc.so
          if-no-files-found: error
          retention-days: 7
