name: Review gate
# Sets the `review` commit status on a PR's head commit (#302): pending until
# the repo owner's account comments a clean review marker naming that commit,
# plus the security and second review markers on a security PR; `error` when
# a run fails. main's ruleset requires it, so the review record is checked
# however a PR is merged. The rules are in tools/review_gate.sh;
# CONTRIBUTING.md ("Claiming work") says what to post.
#
# It runs when a PR's head or labels change, when one closes or gets a new
# base (the recheck job then dispatches it for an open PR that shared its
# head), when a comment is posted, edited or deleted,
# and on dispatch, which the Dependabot branch updater uses after
# it merges main into a branch (a push with the workflow token starts no
# workflows). A PR opened with the workflow token (the upstream watch) gets
# its first status when a marker is posted.
#
# pull_request_target and issue_comment run this file and the script as they
# are on main, and nothing from the PR is checked out or run: the script only
# reads the PR, its files and comments through the API.
on:
  pull_request_target:
    # edited: a new base changes which files and PRs count. closed: an open
    # PR that shared this head can pass again (tools/review_gate.sh).
    types: [opened, reopened, synchronize, labeled, unlabeled, edited, closed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
permissions:
  contents: read
jobs:
  # Not named `review`: a check run with the required status's name would
  # make the requirement ambiguous.
  set-status:
    name: set review status
    # Comments on issues aren't PRs. A dispatch runs main's copy only.
    if: >-
      github.repository == 'zeapsu/reachy-bridge' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    concurrency:
      group: review-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    outputs:
      recheck: ${{ steps.gate.outputs.recheck }}
    steps:
      # Pending first, so the head never sits with no status from this gate
      # (which would leave a same-named check run from elsewhere to stand in
      # for it) while the run below works, or if it dies before it posts.
      # Only for an open PR: a closed one's head may be an open PR's too.
      - if: >-
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.state == 'open' &&
          github.event.pull_request.base.ref == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api -X POST "repos/$GH_REPO/statuses/$SHA" -f state=pending -f context=review \
            -f description="Checking review markers" >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: tools/review_gate.sh
          sparse-checkout-cone-mode: false
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          # Set on the run a retarget starts (an `edited` event with a new base).
          BASE_CHANGED: ${{ github.event.changes.base.ref.from }}
        run: bash tools/review_gate.sh
  # A PR that closed or left the default branch held an open PR with the same
  # head pending; run the gate for that PR as a run of its own, so it queues
  # in that PR's concurrency group behind any run of its own (a marker
  # deleted meanwhile can't lose to it). Its own job: only this one may start
  # workflows, and it runs nothing but the dispatch of main's gate.
  recheck:
    name: re-check PRs with the same head
    needs: set-status
    if: needs.set-status.outputs.recheck != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRS: ${{ needs.set-status.outputs.recheck }}
          MAIN: ${{ github.event.repository.default_branch }}
        run: |
          for n in $PRS; do
            [[ $n =~ ^[1-9][0-9]*$ ]] || { echo "::error::not a PR number: $n"; exit 1; }
            echo "Dispatching the Review gate for #$n"
            gh workflow run review-gate.yml --ref "$MAIN" -f pr="$n"
          done
