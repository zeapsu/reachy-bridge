name: Review gate
# Sets the `review` commit status on a PR's head commit (#302): pending until
# the repo owner comments a clean review marker naming that commit, plus the
# security and second review markers on a security PR. main's ruleset
# requires it, so the review record is checked however a PR is merged. The
# rules are in tools/review_gate.sh; CONTRIBUTING.md ("Claiming work") says
# what to post.
#
# It runs when a PR's head or labels change, when a comment is posted, edited
# or deleted, and on dispatch, which the Dependabot branch updater uses after
# it merges main into a branch (a push with the workflow token starts no
# workflows). A PR opened with the workflow token (the upstream watch) gets
# its first status when a marker is posted.
#
# pull_request_target and issue_comment run this file and the script as they
# are on main, and nothing from the PR is checked out or run: the script only
# reads the PR, its files and comments through the API.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
permissions:
  contents: read
jobs:
  review:
    # Comments on issues aren't PRs. A dispatch runs main's copy only.
    if: >-
      github.repository == 'zeapsu/reachy-bridge' &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request) &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    concurrency:
      group: review-gate-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: tools/review_gate.sh
          sparse-checkout-cone-mode: false
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
        run: bash tools/review_gate.sh
