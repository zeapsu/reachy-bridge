name: Dependabot auto-merge
# Patch and minor updates from Dependabot merge on their own once the
# required checks pass (python, rust-web, sim, shell, and `review` once the
# ruleset requires it); GitHub's auto-merge waits for them. Anything else (a
# major bump, a group that contains one, an update Dependabot can't
# classify, a change under .github/, a `security` or `auth` label, or a
# commit someone else pushed onto the branch) needs review markers first
# (tools/review_gate.sh, #306), so auto-merge stays off: the branch updater
# would otherwise keep merging main into it, and each new head voids the
# markers. It runs again when labels change (on open PRs only; it reads the
# labels live, not from the event). Python updates run on the robot, so they
# still get hardware QA after they land on main.
#
# The PRs this merges squash: one commit per update on main, without the
# merges of main the branch updater adds. Everything else, including the
# Dependabot PRs it leaves for review, merges with a merge commit.
#
# pull_request_target runs this file as it is on main, so a PR that bumps
# fetch-metadata can't change how its own PR is judged. It checks nothing out.
#
# Needs the repository settings "Allow auto-merge" and "Allow squash merging",
# and squash among the allowed merge methods of the main ruleset.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
# One run per PR at a time, in event order, so a run for someone else's push
# can't be overtaken by an earlier run that turns auto-merge back on.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  auto-merge:
    # Open PRs only: removing a label from a merged one still fires `unlabeled`.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.state == 'open' &&
      github.repository == 'zeapsu/reachy-bridge'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: write
      issues: read # the PR's labels, read live
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # update-type skips updates Dependabot couldn't classify, so check each
      # one: all of them must be patch or minor. And judge the branch, not
      # whoever caused this run ("@dependabot rebase" or "Update branch" runs
      # it as that person): every commit must be Dependabot's, or a merge of main by
      # the branch updater (the workflow token).
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPS: ${{ steps.metadata.outputs.updated-dependencies-json }}
          TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          safe=$(jq 'length > 0 and all(.[]; .updateType == "version-update:semver-patch" or .updateType == "version-update:semver-minor")' <<< "${DEPS:-[]}")
          # Made on GitHub (committer web-flow, signed by GitHub), so it wasn't
          # amended or rebased elsewhere; a failed listing counts against it.
          others=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/commits" \
            --jq '.[] | select((.committer.login == "web-flow" and .commit.verification.verified == true and (.author.login == "dependabot[bot]" or (.author.login == "github-actions[bot]" and (.parents | length) > 1))) | not) | .sha') ||
            others="(couldn't list the commits)"
          # Workflow bumps need a review (#306); a failed listing counts as one.
          workflows=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | .filename, (.previous_filename // empty) | select(startswith(".github/"))') ||
            workflows="(couldn't list the files)"
          # A security or auth label asks for the full set of reviews. Read
          # live: the event's copy is stale if labels changed while this run
          # waited its turn.
          flagged=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
            --jq '.[].name | ascii_downcase | select(. == "security" or . == "auth")') ||
            flagged="(couldn't read the labels)"
          if [[ "$safe" == true && -z "$others" && -z "$workflows" && -z "$flagged" ]]; then
            echo merge=true >> "$GITHUB_OUTPUT"
          else
            echo "Leaving it for review: update type '${TYPE:-unknown}'${others:+, commits from someone else: $others}${workflows:+, changes $(tr '\n' ' ' <<< "$workflows")}${flagged:+, label $(tr '\n' ' ' <<< "$flagged")}."
            echo merge=false >> "$GITHUB_OUTPUT"
          fi
      - name: Turn on auto-merge
        if: steps.decide.outputs.merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR"
      # Also when an earlier step failed, so an earlier run's auto-merge goes.
      - name: Leave it for review
        if: always() && steps.decide.outputs.merge != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: |
          # --disable-auto fails when auto-merge is already off, so check the
          # result instead of trusting the exit code.
          gh pr merge --disable-auto "$PR" || echo "--disable-auto failed; checking whether auto-merge is off"
          if [[ $(gh pr view "$PR" --json autoMergeRequest -q '.autoMergeRequest == null') != true ]]; then
            echo "::error::Auto-merge is still on for $PR; turn it off by hand."
            exit 1
          fi
          gh pr edit "$PR" --add-reviewer zeapsu
