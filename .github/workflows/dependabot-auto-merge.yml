name: Dependabot auto-merge

# Patch and minor updates from Dependabot merge on their own once the
# required checks (python, rust-web, sim, shell) pass; GitHub's auto-merge
# waits for them. A major bump, or a group that contains one, stays open for
# the owner. Python updates run on the robot, so they still get hardware QA
# after they land on main.
#
# Needs the repository setting "Allow auto-merge".

on: pull_request

permissions:
  contents: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'zeapsu/reachy-bridge'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # For a group, update-type is the largest change in it.
      - name: Turn on auto-merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --merge "$PR"
      - name: Leave a major bump for review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR" --add-reviewer zeapsu
