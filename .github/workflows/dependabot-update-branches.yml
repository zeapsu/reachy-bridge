name: Dependabot branch updater
# main requires a PR to be up to date before it merges, and auto-merge never
# updates a branch itself. Whenever main may have moved, this merges main into
# the oldest Dependabot PR that has auto-merge on and is behind, then starts CI
# on it: a push made with the workflow token doesn't trigger workflows, but a
# dispatch does, and its checks count for the PR. One PR at a time, so CI isn't
# spent on branches the next merge would leave behind again; when that CI run
# finishes, this runs again for the next one.
#
# Auto-merges made with the workflow token don't trigger the push event
# either, hence the CI-completion trigger and the schedule as a fallback.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "37 */2 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependabot-update-branches
  cancel-in-progress: false
jobs:
  update:
    if: github.repository == 'zeapsu/reachy-bridge'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Update the oldest behind Dependabot PR and start its CI
        run: |
          # Give GitHub a moment to merge the PR whose checks just passed, so
          # the others show as behind.
          sleep 30
          pr=$(gh pr list --author app/dependabot --state open --limit 50 \
            --json number,headRefName,headRefOid,mergeStateStatus,autoMergeRequest,createdAt \
            --jq '[.[] | select(.autoMergeRequest != null and .mergeStateStatus == "BEHIND")] | sort_by(.createdAt) | first // empty | [.number, .headRefName, .headRefOid] | @tsv')
          if [[ -z "$pr" ]]; then
            echo "No Dependabot PR with auto-merge on is behind main."
            exit 0
          fi
          IFS=$'\t' read -r number branch old_sha <<< "$pr"
          echo "Merging main into #$number ($branch)."
          # Refuses if the branch moved since the list above.
          gh api -X PUT "repos/$GH_REPO/pulls/$number/update-branch" -f expected_head_sha="$old_sha"
          # update-branch is async: wait for the new head before starting CI.
          for _ in $(seq 30); do
            [[ "$(gh pr view "$number" --json headRefOid --jq .headRefOid)" != "$old_sha" ]] && break
            sleep 2
          done
          if [[ "$(gh pr view "$number" --json headRefOid --jq .headRefOid)" == "$old_sha" ]]; then
            echo "::error::#$number didn't move after update-branch."
            exit 1
          fi
          gh workflow run ci.yml --ref "$branch"
