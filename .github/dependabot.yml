# Dependency updates. One grouped PR per ecosystem a week, so updates don't
# flood the PR list; a major package bump gets its own PR, since it usually
# needs code changes (actions are grouped whatever the bump). Every PR goes
# through CI (including the sim job) and the usual review gates. The cooldown leaves new releases a week before they're
# proposed, so a broken or compromised release is usually yanked first.
#
# Not covered here:
# - reachy-mini (Pollen's daemon) is bumped by the upstream watch workflow,
#   which tests it against the sim and asks for hardware QA (#155).
# - Toolchains (Rust, Bun, uv, shellcheck) and the gst-plugins-rs version are
#   pinned in the workflows and bumped by hand.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore

  # The workspace lock (uv.lock) holds the runtime's dependencies; they run on
  # the robot, so a PR here needs hardware QA after merge.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: reachy-mini
      # Pinned together on purpose: newer cmeel builds of urdfdom and tinyxml2
      # break `import placo` (runtime/pyproject.toml).
      - dependency-name: placo
      - dependency-name: cmeel-urdfdom
      - dependency-name: cmeel-tinyxml2
      # Moves with uv's own minor version (required-version in pyproject.toml).
      - dependency-name: uv_build
    groups:
      python:
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  - package-ecosystem: cargo
    directory: /controller
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      rust:
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      # three's 0.x minors break its API, and its types must match it.
      three:
        patterns: ["three", "@types/three"]
      web:
        update-types: [minor, patch]
        exclude-patterns: ["three", "@types/three"]
    commit-message:
      prefix: chore
