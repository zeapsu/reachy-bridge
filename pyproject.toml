[project]
name = "reachy-bridge"
version = "0.1.0"
description = "Run a Reachy Mini Lite from a headless Linux edge device: daemon service, controller UI, Hugging Face apps."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Brings the ReachyMini SDK + the `reachy-mini-daemon` entry point.
    # Pinned: the controller and runtime wrapper are tested against this daemon.
    "reachy-mini==1.8.3",
    # 3.2.x throws `unrecognized attribute: site1` on the Reachy model (see CLAUDE.md).
    "mujoco==3.3.7",
    "numpy",
    # JPEG encoding for the daemon's /api/camera/stream.mjpg route
    # (tools/reachy_mini_daemon_media.py). reachy-mini only ships OpenCV as an
    # extra; <5 matches that extra's bound.
    "opencv-python-headless<5",
]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.12,<1"]

[tool.uv]
# Workspace root is a virtual project (not an installable package): it pins the
# daemon/SDK for the shared env and anchors the workspace below.
package = false
# Pin uv minor version to prevent lockfile marker churn (issue #39).
# 0.11 allows the desktop app's bundled 0.11.23, <0.12 forces coordinated minor bumps.
required-version = ">=0.11,<0.12"

[tool.uv.workspace]
# One lockfile + one shared .venv for the whole repo.
members = ["apps/*"]
