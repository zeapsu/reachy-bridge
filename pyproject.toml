[project]
name = "reachy-bridge"
version = "0.1.0"
description = "Run a Reachy Mini Lite from a headless Linux edge device: daemon service, controller UI, Hugging Face apps."
readme = "README.md"
requires-python = "==3.12.*"
# The development environment: the runtime (editable) with MuJoCo for the sim
# daemon. Its dependencies, including the reachy-mini floor, live in
# runtime/pyproject.toml.
dependencies = ["reachy-bridge-runtime[sim]"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.12,<1"]

[tool.uv]
# The root is a virtual project: it isn't installed, it anchors the workspace.
package = false
# Pin uv minor version to prevent lockfile marker churn (issue #39).
# 0.11 allows the desktop app's bundled 0.11.23, <0.12 forces coordinated minor bumps.
required-version = ">=0.11,<0.12"

[tool.uv.workspace]
members = ["runtime"]

[tool.uv.sources]
reachy-bridge-runtime = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["runtime/tests"]
