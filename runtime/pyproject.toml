[project]
name = "reachy-bridge-runtime"
version = "0.1.0"
description = "Pollen's Reachy Mini daemon with the bridge's features and platform adapters."
requires-python = "==3.12.*"
dependencies = [
    # A floor, not a pin: uv.lock records the exact tested version, and #155
    # bumps it as Pollen releases. Upstream internals are only touched in
    # reachy_bridge_runtime/upstream.py.
    "reachy-mini>=1.12",
    "numpy",
    # JPEG encoding for /api/camera/stream.mjpg. reachy-mini ships OpenCV only
    # as an extra; <5 matches that extra's bound.
    "opencv-python-headless<5",
    # Optional Placo kinematics engine (needed for gravity compensation),
    # pinned like reachy-mini's placo-kinematics extra. placo 0.9.14 links
    # urdfdom 4 and tinyxml2 10; newer cmeel builds of those resolve by default
    # and make `import placo` fail with a missing shared library.
    "placo==0.9.14",
    "cmeel-urdfdom<5",
    "cmeel-tinyxml2<11",
]

[project.optional-dependencies]
# MuJoCo for the sim daemon (tests, tools/sim). 3.2.x throws
# `unrecognized attribute: site1` on the Reachy model.
sim = ["mujoco==3.3.7"]

[project.scripts]
reachy-bridge-runtime = "reachy_bridge_runtime.main:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
